# Pipeline de integracion y despliegue continuo (Fase 2: E9 a E13).
# Orden: compilacion y pruebas unitarias -> analisis estatico con quality gate
#        -> pruebas de API -> despliegue al ambiente correspondiente.
# Los checks "Backend", "Frontend", "SonarCloud" y "API" son obligatorios en la
# proteccion de ramas, asi un PR que falle en cualquier etapa no se puede fusionar.
name: CI

on:
  pull_request:
    branches: [dev, qa, main]
  push:
    branches: [dev, qa, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 1. Compilacion y pruebas unitarias ----------
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BACK_END
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: BACK_END/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar (TypeScript)
        run: npm run build

      - name: Pruebas unitarias con cobertura (Jest)
        run: npm run test:coverage -- --ci

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: BACK_END/coverage
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FRONT_END/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FRONT_END/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar (Angular)
        run: npm run build

      - name: Pruebas unitarias con cobertura (Karma + Jasmine)
        run: npm run test:ci

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: FRONT_END/frontend/coverage
          if-no-files-found: ignore

  # ---------- 2. Analisis estatico con quality gate ----------
  sonarcloud:
    name: SonarCloud
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar cobertura del backend
        uses: actions/download-artifact@v4
        with:
          name: cobertura-backend
          path: BACK_END/coverage

      - name: Descargar cobertura del frontend
        uses: actions/download-artifact@v4
        with:
          name: cobertura-frontend
          path: FRONT_END/frontend/coverage

      - name: Analisis SonarCloud y verificacion del quality gate
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Listar bugs y vulnerabilidades abiertos
        if: always() && env.SONAR_TOKEN != ''
        run: |
          KEY=$(grep '^sonar.projectKey=' sonar-project.properties | cut -d= -f2)
          SCOPE="branch=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if [ -n "${{ github.event.pull_request.number }}" ]; then SCOPE="pullRequest=${{ github.event.pull_request.number }}"; fi
          curl -sf -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/issues/search?componentKeys=$KEY&$SCOPE&resolved=false&types=VULNERABILITY,BUG&ps=100" \
            | jq -r '.issues[] | "\(.severity) \(.type) \(.rule) \(.component):\(.line) \(.message)"' || true
          curl -sf -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/hotspots/search?projectKey=$KEY&$SCOPE&status=TO_REVIEW&ps=100" \
            | jq -r '.hotspots[] | "HOTSPOT \(.vulnerabilityProbability) \(.ruleKey) \(.component):\(.line) \(.message)"' || true

      - name: Aviso si falta configurar SonarCloud
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::Falta el secreto SONAR_TOKEN, el analisis de SonarCloud no se ejecuto"

  # ---------- 3. Pruebas de API ----------
  api:
    name: API
    needs: sonarcloud
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BACK_END
    env:
      PORT: 3000
      JWT_SECRET: ci-only-secret
      DB_PATH: /tmp/ecommerce-ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: BACK_END/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      - name: Levantar la API con una copia de la base de datos
        run: |
          cp ecommerce.db "$DB_PATH"
          nohup npm start > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health && exit 0
            sleep 1
          done
          cat api.log
          exit 1

      - name: Pruebas de API (Newman)
        run: npm run test:api

      - name: Publicar reporte de Newman
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-newman
          path: BACK_END/reports
          if-no-files-found: ignore

  # ---------- 4. Despliegue ----------
  # Solo despliega cuando el cambio ya fue fusionado (push) en main, que es PROD.
  # dev y qa ejecutan todas las etapas anteriores pero no despliegan.
  deploy:
    name: Despliegue (PROD)
    needs: api
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: https://e-commerce-proyecto-aseguramiento-backend.onrender.com
    env:
      DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      APP_URL: https://e-commerce-proyecto-aseguramiento-backend.onrender.com
    steps:
      - name: Verificar secreto de despliegue
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Falta el secreto RENDER_DEPLOY_HOOK"
            exit 1
          fi

      # Un solo servicio en Render compila backend y frontend; Express sirve el build
      # de Angular y la API desde el mismo origen.
      - name: Desplegar en Render
        run: curl -fsS -X POST "$DEPLOY_HOOK"

      - name: Verificar que la aplicacion desplegada responde
        run: |
          sleep 90
          for i in $(seq 1 30); do
            if curl -sf "$APP_URL/api/health"; then exit 0; fi
            echo "Esperando a Render ($i/30)..."
            sleep 20
          done
          exit 1
