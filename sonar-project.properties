# Analisis estatico con SonarCloud (E12)
# Si SonarCloud asigna otra organizacion o clave, cambiar estas dos lineas.
sonar.organization=jonathan11088
sonar.projectKey=jonathan11088_E-Commerce-proyecto-Aseguramiento
sonar.projectName=E-Commerce proyecto Aseguramiento

sonar.sourceEncoding=UTF-8
sonar.sources=BACK_END/src,FRONT_END/frontend/src
sonar.tests=BACK_END/tests,FRONT_END/frontend/src
sonar.test.inclusions=BACK_END/tests/**/*.ts,FRONT_END/frontend/src/**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,BACK_END/src/seeds/data/**,BACK_END/src/migrations/**

# Cobertura generada por Jest (backend) y Karma (frontend) en el pipeline
sonar.javascript.lcov.reportPaths=BACK_END/coverage/lcov.info,FRONT_END/frontend/coverage/frontend/lcov.info
# Codigo de arranque y datos de ejemplo sin logica de negocio. Los controladores, rutas y app.ts
# solo conectan HTTP con los servicios y se verifican con las pruebas de API (E11).
sonar.coverage.exclusions=BACK_END/src/controllers/**,BACK_END/src/routes/**,BACK_END/src/app.ts,BACK_END/src/seeds/**,BACK_END/src/scripts/**,BACK_END/src/config/**,BACK_END/src/entities/**,BACK_END/src/index.ts,FRONT_END/frontend/src/main.ts,FRONT_END/frontend/src/environments/**

# El pipeline espera el resultado del quality gate y falla si no se aprueba
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
